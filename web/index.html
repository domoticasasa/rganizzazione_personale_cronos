  <script>
    // Recovery: un solo host (www) + salva token PRIMA che Flutter tocchi l'URL.
    (function () {
      try {
        var host = (location.hostname || '').toLowerCase();
        var path = location.pathname || '/';
        var q = String(location.search || '');
        var isRecovery =
          path.indexOf('password-recovery') !== -1 ||
          q.indexOf('token_hash=') !== -1;
        if (isRecovery && host === 'gestopro360.it') {
          location.replace(
            'https://www.gestopro360.it' + path + q + (location.hash || '')
          );
          return;
        }
        var h = String(location.hash || '');
        if (
          h.indexOf('access_token') !== -1 ||
          h.indexOf('type=recovery') !== -1 ||
          h.indexOf('refresh_token') !== -1
        ) {
          sessionStorage.setItem('cronos_supabase_auth_hash', h);
        }
        if (q.indexOf('code=') !== -1 || q.indexOf('token_hash=') !== -1) {
          sessionStorage.setItem('cronos_supabase_auth_search', q);
        }
        var params = new URLSearchParams(q);
        var th = params.get('token_hash');
        if (th) {
          sessionStorage.setItem('cronos_recovery_token_hash', th);
          history.replaceState(null, '', '/password-recovery');
        }
        var aq = params.get('auth_qr');
        if (aq) {
          sessionStorage.setItem('cronos_auth_qr', String(aq).trim().toUpperCase());
          // Canonico www + /login così non si perde il codice su apex/redirect SPA.
          if (host === 'gestopro360.it' || path === '/' || path === '') {
            location.replace(
              'https://www.gestopro360.it/login?auth_qr=' +
                encodeURIComponent(String(aq).trim())
            );
            return;
          }
        }
        var vm = params.get('vm');
        if (vm) {
          sessionStorage.setItem('cronos_viaggio_mezzo_vm', vm);
        }
        var bp = params.get('bp');
        if (bp) {
          sessionStorage.setItem('cronos_buono_pasto_bp', bp);
        }
      } catch (e) {}
    })();
  </script>

  <script>

        var h = (location.hostname || '').toLowerCase();
        var legacy =
          h === 'pernotti.pages.dev' ||
          h === 'gestopro.pages.dev' ||
          h.endsWith('.pernotti.pages.dev') ||
          h.endsWith('.gestopro.pages.dev');
        if (!legacy && h !== 'gestopro360.it') return;
        var target =
          'https://www.gestopro360.it' +
          location.pathname +
          location.search +
          location.hash;
        location.replace(target);
      } catch (_) {}
    })();
