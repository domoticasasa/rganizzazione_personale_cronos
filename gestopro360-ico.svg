<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Gestopro360 icona</title>
  <desc id="desc">Icona quadrata per app e favicon Gestopro360.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F7FF"/>
      <stop offset="100%" stop-color="#E6F8FF"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243A93"/>
      <stop offset="50%" stop-color="#4C73FF"/>
      <stop offset="100%" stop-color="#29C8EE"/>
    </linearGradient>
    <linearGradient id="core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDF4FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#304E9D" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <g transform="translate(256 256)" filter="url(#shadow)">
    <circle r="164" fill="#FFFFFF" opacity="0.82"/>
    <circle r="136" fill="none" stroke="#CFE1FF" stroke-width="12"/>
    <path d="M0 -136 A136 136 0 1 1 -114 84" fill="none" stroke="url(#ring)" stroke-width="21" stroke-linecap="round"/>
    <path d="M-120 79 L-143 126 L-89 119 Z" fill="#29C8EE"/>

    <rect x="-58" y="-75" width="120" height="156" rx="18" fill="url(#core)" stroke="#A8C3FF" stroke-width="5"/>
    <rect x="-40" y="-48" width="84" height="10" rx="5" fill="#A9BDEE"/>
    <rect x="-40" y="-28" width="72" height="10" rx="5" fill="#B7CAF3"/>
    <rect x="-40" y="-8" width="78" height="10" rx="5" fill="#C4D5F7"/>
    <path d="M-40 37 L-17 60 L39 4" fill="none" stroke="#1CB37A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
