<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Gestopro360 icona premium</title>
  <desc id="desc">Icona moderna per app e favicon con monogramma G360.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1C4E"/>
      <stop offset="100%" stop-color="#1A4CA5"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="56%">
      <stop offset="0%" stop-color="#57CFFF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#57CFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3C5DDF"/>
      <stop offset="100%" stop-color="#29D9F5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#061233" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="492" height="492" rx="108" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="188" fill="url(#halo)"/>

  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="152" fill="#F9FCFF"/>
    <circle cx="256" cy="256" r="134" fill="none" stroke="#9CC7FF" stroke-width="10"/>
    <path d="M256 122 A134 134 0 1 1 144 338" fill="none" stroke="url(#ring)" stroke-width="19" stroke-linecap="round"/>
    <path d="M149 333 L130 373 L176 366 Z" fill="#29D9F5"/>
    <text x="247" y="284" text-anchor="middle" font-family="Sora, Inter, Arial, sans-serif" font-size="144" font-weight="800" fill="#243F97">G</text>
    <text x="305" y="327" text-anchor="middle" font-family="Sora, Inter, Arial, sans-serif" font-size="41" font-weight="800" fill="#2B84D8">360</text>
  </g>
</svg>
