
[storage]
# Limite globale progetto (deve essere >= limite bucket video istruttivi).
# Il limite per-bucket non può superare questo valore.
file_size_limit = "700MiB"

[storage.buckets.app_instructional_videos]
public = false
file_size_limit = "700MiB"
allowed_mime_types = ["video/mp4", "video/quicktime", "video/webm", "video/3gpp"]

[auth]
# Dominio canonico di produzione (custom domain Cloudflare).
site_url = "https://gestopro360.it"
additional_redirect_urls = [
  "myapp://auth-callback",
  "https://gestopro360.it",
  "https://gestopro360.it/**",
  "https://gestopro360.it/login",
  "https://gestopro360.it/password-recovery",
  "https://www.gestopro360.it",
  "https://www.gestopro360.it/**",
  "https://www.gestopro360.it/login",
  "https://www.gestopro360.it/password-recovery",
  "https://gestopro.pages.dev",
  "https://gestopro.pages.dev/**",
  "https://gestopro.pages.dev/login",
  "https://pernotti.pages.dev",
  "https://pernotti.pages.dev/**",
  "https://pernotti.pages.dev/login",
  "https://6cae88f3.pernotti.pages.dev",
  "https://6cae88f3.pernotti.pages.dev/**",
  "https://6cae88f3.pernotti.pages.dev/login",
  "http://localhost:*/**",
  "http://127.0.0.1:*/**",
]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Passkeys / WebAuthn — RP produzione (commentato: CLI locale non supporta auth.passkey/webauthn).
# Abilita in Dashboard → Authentication → Passkeys oppure Management API.
# [auth.passkey]
# enabled = true
#
# [auth.webauthn]
# rp_display_name = "Cronos Gestopro"
# rp_id = "gestopro360.it"
# rp_origins = [
#   "https://gestopro360.it",
#   "https://www.gestopro360.it",
# ]

[auth.email]
enable_confirmations = true
# Prima era 1m0s: troppo restrittivo per reset password / test.
# L'invio login usa Resend (request-password-reset); questo vale solo come fallback Auth.
max_frequency = "10s"
otp_length = 8

[functions.admin-create-user]
enabled = true
verify_jwt = true
import_map = "./functions/admin-create-user/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/admin-create-user/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/admin-create-user/*.html" ]

[functions.admin-reset-password]
enabled = true
verify_jwt = true
import_map = "./functions/admin-reset-password/deno.json"
entrypoint = "./functions/admin-reset-password/index.ts"

[auth.email.template.recovery]
# Template italiano GESTOPRO360 (fallback Auth; l'invio normale è via Resend).
subject = "GESTOPRO360 - Imposta una nuova password"
content_path = "./supabase/templates/recovery.html"

