
[auth]
site_url = "https://6cae88f3.pernotti.pages.dev"
additional_redirect_urls = ["myapp://auth-callback", "https://6cae88f3.pernotti.pages.dev/*"]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
# Prima era 1m0s: troppo restrittivo per reset password / test (anche dopo 1 minuto poteva restare bloccato).
# Dopo modifica: supabase config push (progetto collegato) oppure Dashboard → Authentication → Email.
max_frequency = "10s"
otp_length = 8

[functions.admin-create-user]
enabled = true
verify_jwt = true
import_map = "./functions/admin-create-user/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/admin-create-user/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/admin-create-user/*.html" ]

